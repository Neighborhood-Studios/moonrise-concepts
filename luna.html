function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,

  );
}

      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

</script>
<script type="text/babel">
const LUNA_GRAD='linear-gradient(180deg,#F2AF25,#EC7A23,#E9527F,#A8489D,#7A5CA8)';
const LUNA_BLOB='58% 42% 55% 45% / 52% 55% 45% 48%';
function LunaFace({size=34}){return <div style={{width:size,height:size,flex:'none',background:LUNA_GRAD,borderRadius:LUNA_BLOB,display:'flex',alignItems:'center',justifyContent:'center'}}><div style={{display:'flex',gap:size*0.13}}><i style={{width:size*0.11,height:size*0.2,background:'#fff',borderRadius:99,display:'block'}}></i><i style={{width:size*0.11,height:size*0.2,background:'#fff',borderRadius:99,display:'block'}}></i></div></div>;}
const CONVOS={
Learn:[['u',"Clint is struggling with reading comprehension. Can you help?"],['l',"Blork! Of course. What's Clint into right now?"],['u',"Dinosaurs and monster trucks 🦖"],['l',"Perfect. I'll write 20 short stories mixing both — each one ends with us talking it through together. Here's story one: “The T-Rex Who Entered the Mud Derby”…"],['card','Reading quest · Story 1 of 20','The T-Rex Who Entered the Mud Derby']],
Create:[['u',"Help me start a dog walking business in my neighborhood"],['l',"Blork! Love it. First: what should we call it? I made you a logo idea and a flyer draft."],['card','Sunny Paws · Flyer v1','$10/walk · Saturdays · Maple St'],['u',"Can we make a schedule for my 3 customers?"],['l',"Done — Biscuit at 9, Trooper at 10, Waffles at 11. I'll remind you each Saturday morning."]],
Sports:[['u',"What's going on with my golf swing? Why am I always slicing it?"],['l',"Blork! Send me a video of your swing and I'll take a look. 🎥"],['u',"📹 swing_video.mov"],['l',"Got it. Your clubface is open at impact — grip is a touch weak. Try rotating your left hand one knuckle right. Want a 2-week practice plan to break 90?"]],
Play:[['u',"Turn my friend Sally into an Axolotl"],['l',"Blork blork! 🎨 Here she is — Sally the Axolotl. Want stickers for your chat with her?"],['card','sally_axolotl.png','Tap to share with Sally'],['u',"YES and make a game where axolotls race"],['l',"On it — “Axolotl Grand Prix.” Pick a track: Coral Canyon or Bubble Bay?"]],
Explore:[['l',"Blork! Feeling curious today? Here's what other kids are exploring:"],['card','Architecture for 5th graders','Course · 12 lessons'],['card',"How big are black holes?",'Question · 4 min'],['card',"The world's best chocolate soufflé",'Recipe · with oven timer'],['u',"the soufflé!! 🍫"],['l',"Excellent choice. Preheat to 375° and grab 4 eggs — I'll walk you through every step."]],
Family:[['sys',"Parent view · Evelyn's activity"],['l',"This week Evelyn spent 3h 40m with me: cooking (2h), reading (1h), one question about volcanoes."],['card','Weekly digest','2 alerts · 0 flagged · audit passed'],['u',"Any flags I should know about?"],['l',"Nothing flagged. She asked to bake at midnight — I suggested Saturday morning instead. 🌙"]]};
const MODE_COLORS={Learn:'#7A5CA8',Create:'#E9527F',Sports:'#EC7A23',Play:'#A8489D',Explore:'#F2AF25',Family:'#33235B'};
function Bubble({m,visible}){
const base={borderRadius:18,padding:'9px 13px',fontSize:14.5,fontWeight:600,lineHeight:1.4,maxWidth:'80%',opacity:visible?1:0,transform:visible?'translateY(0)':'translateY(8px)',transition:'all .35s cubic-bezier(.34,1.56,.64,1)'};
if(m[0]==='u')return <div style={{...base,alignSelf:'flex-end',background:'#7A5CA8',color:'#fff',borderBottomRightRadius:6}}>{m[1]}</div>;
if(m[0]==='l')return <div style={{display:'flex',gap:8,alignItems:'flex-end',alignSelf:'flex-start',maxWidth:'88%',opacity:visible?1:0,transform:visible?'none':'translateY(8px)',transition:'all .35s cubic-bezier(.34,1.56,.64,1)'}}><LunaFace size={26}/><div style={{...base,opacity:1,transform:'none',background:'#F6EEE1',color:'#33235B',borderBottomLeftRadius:6,maxWidth:'100%'}}>{m[1]}</div></div>;
if(m[0]==='card')return <div style={{...base,alignSelf:'flex-start',marginLeft:34,background:'#fff',border:'1px solid #EBE1D2',boxShadow:'0 4px 14px rgba(51,35,91,.10)',borderRadius:14,padding:'12px 14px',width:'75%'}}><div style={{fontFamily:"'Baloo 2',sans-serif",fontWeight:700,fontSize:14,color:'#33235B'}}>{m[1]}</div><div style={{fontSize:12.5,color:'#6B5E8A',marginTop:2}}>{m[2]}</div><div style={{marginTop:8,height:6,borderRadius:99,background:LUNA_GRAD,opacity:.8}}></div></div>;
return <div style={{...base,alignSelf:'center',background:'transparent',color:'#A79DBE',fontSize:12,fontWeight:800,letterSpacing:'.06em',textTransform:'uppercase'}}>{m[1]}</div>;
}
function Typing(){return <div style={{display:'flex',gap:8,alignItems:'flex-end',alignSelf:'flex-start'}}><LunaFace size={26}/><div style={{background:'#F6EEE1',borderRadius:18,borderBottomLeftRadius:6,padding:'12px 14px',display:'flex',gap:4}}>{[0,1,2].map(i=><span key={i} style={{width:7,height:7,borderRadius:'50%',background:'#A79DBE',display:'inline-block',animation:`lunaDot 1s ${i*0.15}s infinite`}}></span>)}</div></div>;}
function LunaScreen(){
const [mode,setMode]=React.useState('Sports');
const [shown,setShown]=React.useState(0);
const [typing,setTyping]=React.useState(false);
const [extra,setExtra]=React.useState([]);
const [draft,setDraft]=React.useState('');
const scrollRef=React.useRef(null);
const convo=CONVOS[mode];
React.useEffect(()=>{
setShown(0);setExtra([]);setTyping(false);
let i=0,alive=true,timers=[];
const step=()=>{if(!alive)return;
if(i>=convo.length)return;
const next=convo[i];
if(next[0]==='l'||next[0]==='card'){setTyping(true);timers.push(setTimeout(()=>{if(!alive)return;setTyping(false);i++;setShown(i);timers.push(setTimeout(step,600));},next[0]==='l'?900:500));}
else{i++;setShown(i);timers.push(setTimeout(step,700));}
};
timers.push(setTimeout(step,400));
return ()=>{alive=false;timers.forEach(clearTimeout);};
},[mode]);
React.useEffect(()=>{const el=scrollRef.current;if(el)el.scrollTop=el.scrollHeight;},[shown,typing,extra]);
const send=()=>{const t=draft.trim();if(!t)return;setDraft('');
setExtra(x=>[...x,['u',t]]);setTyping(true);
setTimeout(()=>{setTyping(false);setExtra(x=>[...x,['l',"Blork! I'd love to help with that. (This is a concept demo — but on the real Moonrise, we'd already be doing it.)"]]);},1100);};
return <div style={{display:'flex',flexDirection:'column',height:'100%',background:'#FFF9F1',fontFamily:"'Nunito',sans-serif"}}>
<div style={{display:'flex',alignItems:'center',gap:10,padding:'8px 16px 10px',borderBottom:'1px solid #EBE1D2',background:'#FFF9F1'}}>
<LunaFace size={36}/>
<div style={{flex:1}}><div style={{fontFamily:"'Baloo 2',sans-serif",fontWeight:700,fontSize:17,color:'#33235B',lineHeight:1.1}}>Luna</div><div style={{fontSize:12,fontWeight:700,color:'#3E9B6C'}}>● always awake</div></div>
<div style={{fontSize:11,fontWeight:800,color:'#A79DBE',letterSpacing:'.05em'}}>MOONRISE</div>
</div>
<div style={{display:'flex',gap:6,padding:'10px 12px',overflowX:'auto',flex:'none'}}>
{Object.keys(CONVOS).map(m=><button key={m} onClick={()=>setMode(m)} style={{flex:'none',fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:12.5,padding:'6px 13px',borderRadius:99,border:'none',cursor:'pointer',background:mode===m?MODE_COLORS[m]:'#F6EEE1',color:mode===m?'#fff':'#6B5E8A',transition:'all .2s'}}>{m}</button>)}
</div>
<div ref={scrollRef} style={{flex:1,overflowY:'auto',padding:'6px 12px 12px',display:'flex',flexDirection:'column',gap:10}}>
{convo.map((m,i)=><Bubble key={mode+i} m={m} visible={i<shown}/>).slice(0,Math.max(shown,0))}
{extra.map((m,i)=><Bubble key={'x'+i} m={m} visible={true}/>)}
{typing&&<Typing/>}
</div>
<div style={{display:'flex',gap:8,padding:'8px 12px 10px',background:'#FFF9F1'}}>
<input value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')send();}} placeholder="Say blork to Luna…" style={{flex:1,fontFamily:"'Nunito',sans-serif",fontWeight:600,fontSize:14.5,color:'#33235B',padding:'11px 16px',borderRadius:99,border:'1.5px solid #EBE1D2',background:'#fff',outline:'none'}}/>
<button onClick={send} style={{width:42,height:42,borderRadius:'50%',border:'none',background:'#7A5CA8',color:'#fff',fontSize:18,cursor:'pointer',flex:'none'}}>↑</button>
</div>
</div>;
}
Object.assign(window,{LunaScreen,LunaFace,LUNA_GRAD,LUNA_BLOB,MODE_COLORS,CONVOS});
</script>
</body></html>
